name: Build Android AAB

on:
  workflow_dispatch:
    inputs:
      generate_keystore:
        description: 'Generate NEW keystore (first time only — do NOT use if keystore already exists in secrets)'
        required: false
        default: 'false'
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Generate new release keystore
        if: ${{ inputs.generate_keystore == true }}
        run: |
          cd android-twa
          keytool -genkey -v \
            -keystore release.keystore \
            -alias otlobfanni-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASS || 'changeme_store' }}" \
            -keypass  "${{ secrets.KEY_PASS     || 'changeme_key'   }}" \
            -dname "CN=OtlobFanni, OU=Mobile, O=OtlobFanni, L=Tripoli, S=Tripoli, C=LY"
          echo "════ SHA-256 FINGERPRINT (for assetlinks.json) ════"
          keytool -list -v \
            -keystore release.keystore \
            -alias otlobfanni-release \
            -storepass "${{ secrets.KEYSTORE_PASS || 'changeme_store' }}" \
            2>/dev/null | grep "SHA256:"
          echo "════ KEYSTORE_BASE64 (copy to GitHub Secrets) ════"
          base64 -w 0 release.keystore

      - name: Restore keystore from secret
        if: ${{ inputs.generate_keystore != true }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android-twa/release.keystore
          echo "Keystore restored."

      - name: Install dependencies
        working-directory: android-twa
        run: npm install

      - name: Build Android AAB
        working-directory: android-twa
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: npm run build:android

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android-twa/app-release.aab
          retention-days: 30

      - name: Upload generated keystore (first-time setup only)
        if: ${{ inputs.generate_keystore == true }}
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-STORE-SAFELY
          path: android-twa/release.keystore
          retention-days: 7

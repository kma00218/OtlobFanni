<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <rect width="128" height="128" rx="28" fill="#F1F3F5"/>

  <!-- Truck long body / cargo bed -->
  <path d="M8 56H72V88H8V56Z" stroke="#071B33" stroke-width="7" stroke-linejoin="round"/>

  <!-- Cab section -->
  <path d="M72 44H102L118 64V88H72V44Z" stroke="#071B33" stroke-width="7" stroke-linejoin="round"/>

  <!-- Windshield -->
  <path d="M76 48H99L112 64H76V48Z" fill="#C8DAE8" stroke="#071B33" stroke-width="4" stroke-linejoin="round"/>

  <!-- Driver head -->
  <circle cx="96" cy="56" r="7" fill="#FF7900"/>

  <!-- Driver shoulders -->
  <path d="M84 72C84 65 89 61 96 61C103 61 108 65 108 72" fill="#FF7900"/>

  <!-- Cargo stripes on truck bed -->
  <line x1="12" y1="66" x2="68" y2="66" stroke="#FF7900" stroke-width="5" stroke-linecap="round"/>
  <line x1="12" y1="76" x2="68" y2="76" stroke="#FF7900" stroke-width="5" stroke-linecap="round"/>

  <!-- Front double rear wheels (heavy truck style) -->
  <circle cx="26" cy="93" r="10" fill="#FF7900" stroke="#071B33" stroke-width="5"/>
  <circle cx="26" cy="93" r="3.5" fill="#071B33"/>
  <circle cx="50" cy="93" r="10" fill="#FF7900" stroke="#071B33" stroke-width="5"/>
  <circle cx="50" cy="93" r="3.5" fill="#071B33"/>

  <!-- Rear drive axle wheel -->
  <circle cx="100" cy="93" r="10" fill="#FF7900" stroke="#071B33" stroke-width="5"/>
  <circle cx="100" cy="93" r="3.5" fill="#071B33"/>
</svg>
